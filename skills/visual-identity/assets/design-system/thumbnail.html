<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brand Identity Kit</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { display:grid; place-items:center; min-height:100vh; background:var(--color-ink); margin:0 }
  .cover { text-align:center; color:var(--color-paper); padding:var(--space-7) }
  .cover .sym { margin:0 auto var(--space-5) }
  .cover h1 { font-size:2.1rem; letter-spacing:.01em; color:var(--color-paper) }
  .cover .ar { font-size:1.35rem; color:var(--color-paper); opacity:.75; margin-top:var(--space-2) }
  .cover p { color:color-mix(in srgb, var(--color-paper) 62%, transparent); font-size:var(--size-small); margin:var(--space-4) auto 0; max-width:34ch }
  .chips { display:flex; gap:var(--space-2); justify-content:center; margin-top:var(--space-6) }
  .chips i { width:44px; height:10px; border-radius:99px; display:block }
</style>
</head>
<body>
  <div class="cover">
    <svg class="sym" width="76" height="56" viewBox="0 0 76 56" aria-hidden="true">
      <path d="M38 4 L60 46 H16 Z" fill="var(--color-ember)"/>
      <path d="M38 20 L50 46 H26 Z" fill="var(--color-ink)"/>
    </svg>
    <h1>Brand Identity Kit</h1>
    <div class="ar">جمرة</div>
    <p>Guidelines and presentation as living pages. Swap the tokens; the kit re-renders.</p>
    <div class="chips">
      <i style="background:var(--color-ink); box-shadow:0 0 0 1px color-mix(in srgb,var(--color-paper) 30%, transparent)"></i>
      <i style="background:var(--color-paper)"></i>
      <i style="background:var(--color-ember)"></i>
    </div>
  </div>
</body>
</html>
